name: Bug report
description: Something does not work the way the docs say it should.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this!
        **Security problem?** Do not use this form. Follow [SECURITY.md](https://github.com/hayone1/cert-manager-webhook-contabo/blob/main/SECURITY.md).
        **Never paste your Contabo client secret, API password or access tokens here.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw. Include the exact error message from the Challenge if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: The Certificate and issuer you used (remove secrets) and the steps you took.
      placeholder: |
        1. Create this ClusterIssuer: ...
        2. Create this Certificate: ...
        3. The challenge stays pending with: ...
    validations:
      required: true
  - type: input
    id: webhook-version
    attributes:
      label: Webhook version
      description: The image tag or chart version you run, for example 0.1.0.
    validations:
      required: true
  - type: input
    id: cert-manager-version
    attributes:
      label: cert-manager and Kubernetes version
      placeholder: cert-manager v1.21.3, Kubernetes 1.35
    validations:
      required: true
  - type: textarea
    id: challenge
    attributes:
      label: Challenge status
      description: "Output of `kubectl describe challenge -n <namespace>`."
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Webhook logs, ideally with the Helm value `logLevel=4`:
        `kubectl -n cert-manager logs deploy/cert-manager-webhook-contabo`.
        **Remove all secrets first.**
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I read the [troubleshooting guide](https://github.com/hayone1/cert-manager-webhook-contabo/blob/main/docs/troubleshooting.md) and the [edge cases](https://github.com/hayone1/cert-manager-webhook-contabo/blob/main/docs/edge-cases.md).
          required: true
        - label: I removed all secrets and tokens from this report.
          required: true
