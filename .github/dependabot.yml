version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(go)"
    groups:
      # cert-manager pins its own k8s.io versions; update them together.
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*", "github.com/cert-manager/*"]
      go-dependencies:
        patterns: ["*"]
        exclude-patterns: ["k8s.io/*", "sigs.k8s.io/*", "github.com/cert-manager/*"]
    # Wait a few days before taking a new version. Most bad releases are
    # pulled within that time.
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(actions)"
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(docker)"
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /test/e2e/fakecontabo
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(docker)"
    cooldown:
      default-days: 7
