# Pushes charts/artifacthub-repo.yml to the chart's OCI repository as the
# special tag "artifacthub.io". Artifact Hub reads it to mark the repository
# as owned by us ("Verified Publisher"). See docs/releasing.md#artifact-hub.
name: Artifact Hub metadata

on:
  push:
    branches: [main]
    paths: [charts/artifacthub-repo.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: artifacthub
  cancel-in-progress: false

jobs:
  push:
    name: Push Artifact Hub repository metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write # push the artifacthub.io tag to GHCR
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      - name: Push metadata
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          file=charts/artifacthub-repo.yml
          [ -f "$file" ] || { echo "::notice::$file does not exist yet, nothing to push"; exit 0; }
          cd charts
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GH_ACTOR" --password-stdin
          oras push ghcr.io/hayone1/charts/cert-manager-webhook-contabo:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
