# Contabo API credentials for the webhook.
# Get the four values at https://my.contabo.com/api/details
#
# For a ClusterIssuer, put this Secret in cert-manager's namespace.
# For an Issuer, put it in the Issuer's namespace (and allow it with the
# Helm value extraSecretAccess).
#
# Never commit a filled-in copy of this file.
apiVersion: v1
kind: Secret
metadata:
  name: contabo-credentials
  namespace: cert-manager
type: Opaque
stringData:
  client-id: INT-12345678
  client-secret: replace-me
  api-user: you@example.com
  api-password: replace-me
